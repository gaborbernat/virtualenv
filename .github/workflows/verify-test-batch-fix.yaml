name: verify-test-batch-regression-fix
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  verify:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: install virtualenv with test deps
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-mock pytest-xdist pytest-randomly pytest-timeout pytest-env pytest-rerunfailures time-machine distlib

      - name: run the full test_batch parametrization matrix
        run: python -m pytest tests/unit/activation/test_batch.py --int -n auto --dist loadfile -vv --no-header --tb=short
