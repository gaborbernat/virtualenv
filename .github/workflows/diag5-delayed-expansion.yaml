name: diag5-delayed-expansion
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  diag:
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install -e .

      - name: build a venv with an exclamation-mark prompt
        shell: python
        run: |
          from virtualenv import cli_run
          cli_run(["--prompt", "foo!SECRET!bar", "venv_bang"])
          import pathlib
          bat = pathlib.Path("venv_bang") / "Scripts" / "activate.bat"
          for line in bat.read_text(encoding="utf-8").splitlines():
              if "VIRTUAL_ENV_PROMPT=" in line:
                  print(repr(line))

      - name: activate under cmd /V:ON (delayed expansion pre-enabled) with a SECRET var set
        shell: cmd
        run: |
          set SECRET=leaked-value
          cmd /V:ON /C "call venv_bang\Scripts\activate.bat & echo PROMPT_VALUE=%VIRTUAL_ENV_PROMPT%"

      - name: activate normally (no delayed expansion) for comparison
        shell: cmd
        run: |
          set SECRET=leaked-value
          call venv_bang\Scripts\activate.bat
          echo PROMPT_VALUE_NORMAL=%VIRTUAL_ENV_PROMPT%
