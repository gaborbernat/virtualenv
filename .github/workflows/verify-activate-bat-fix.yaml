name: verify-activate-bat-fix
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  verify:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: install patched virtualenv from this checkout
        run: python -m pip install .

      - name: build venv with the same malicious --prompt as before
        shell: python
        run: |
          from virtualenv import cli_run
          payload = 'x" & type nul > pwned.marker & "'
          cli_run(["--prompt", payload, "venv_repro"])

      - name: show the rendered activate.bat prompt line
        shell: pwsh
        run: |
          Select-String -Path venv_repro\Scripts\activate.bat -Pattern "VIRTUAL_ENV_PROMPT" | ForEach-Object { $_.Line }

      - name: run activate.bat exactly as a victim would
        shell: cmd
        run: |
          call venv_repro\Scripts\activate.bat
          echo ACTIVATE_RETURNED %ERRORLEVEL%
          echo PROMPT_VALUE=%VIRTUAL_ENV_PROMPT%

      - name: verdict
        shell: pwsh
        run: |
          if (Test-Path pwned.marker) {
            Write-Host "STILL VULNERABLE: activate.bat executed an injected command from --prompt"
            exit 1
          } else {
            Write-Host "FIX CONFIRMED: no injected command executed"
          }
