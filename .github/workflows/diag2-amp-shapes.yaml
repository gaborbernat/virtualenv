name: diag2-amp-shapes
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  diag:
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: write isolated bat cases
        shell: python
        run: |
          import pathlib

          cases = {
              "case_bare_spaced": 'a & echo b',
              "case_bare_nospace": 'a&b',
              "case_doubled_nospace": 'a&&b',
              "case_with_redirect": 'a & type nul > marker_redirect.txt & b',
              "case_doubled_with_redirect": 'a && type nul > marker_doubled_redirect.txt && b',
          }
          for name, value in cases.items():
              lines = [
                  "@echo off",
                  f'@set "VAR={value}"',
                  "echo VALUE_IS=%VAR%",
              ]
              pathlib.Path(f"{name}.bat").write_text("\r\n".join(lines) + "\r\n", encoding="ascii")

      - name: run each case
        shell: cmd
        run: |
          for %%f in (case_*.bat) do (
            echo === %%f ===
            call %%f
          )

      - name: verdict
        shell: pwsh
        run: |
          Get-ChildItem -Filter "marker_*.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "MARKER CREATED: $($_.Name)" }
          if (-not (Get-ChildItem -Filter "marker_*.txt" -ErrorAction SilentlyContinue)) { Write-Host "no markers created" }
