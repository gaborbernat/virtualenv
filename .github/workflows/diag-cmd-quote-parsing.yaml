name: diag-cmd-quote-parsing
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  diag:
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: write a minimal bat file with the exact rendered line
        shell: pwsh
        run: |
          $lines = @(
            '@echo off',
            '@set "VIRTUAL_ENV_PROMPT=x  & type nul > diag1.marker &  "',
            '@set "OTHER=x"" & type nul > diag2.marker & """',
            'echo done PROMPT=%VIRTUAL_ENV_PROMPT%'
          )
          Set-Content -Path diag.bat -Value $lines -Encoding ascii

      - name: show file bytes
        shell: pwsh
        run: |
          Get-Content diag.bat

      - name: run it
        shell: cmd
        run: |
          call diag.bat
          echo RETURNED %ERRORLEVEL%

      - name: verdict
        shell: pwsh
        run: |
          "diag1 (no embedded quotes, our fix's shape): " + (Test-Path diag1.marker)
          "diag2 (embedded quotes, vulnerable shape): " + (Test-Path diag2.marker)
