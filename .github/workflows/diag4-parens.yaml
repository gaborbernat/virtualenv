name: diag4-parens-caret
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  diag:
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: write isolated bat cases
        shell: python
        run: |
          import pathlib
          cases = {
              "case_parens": r'C:\Program Files (x86)\Python39\tcl',
              "case_caret": r'C:\weird^path\tcl',
              "case_single_paren": r'C:\odd(dir\tcl',
          }
          for name, value in cases.items():
              lines = [
                  "@echo off",
                  f'@set "VAR={value}"',
                  "echo VALUE_IS=%VAR%",
              ]
              pathlib.Path(f"{name}.bat").write_text("\r\n".join(lines) + "\r\n", encoding="ascii")

      - name: run each case
        shell: cmd
        run: |
          for %%f in (case_*.bat) do (
            echo === %%f ===
            call %%f
          )
