name: diag6-delayed-expansion-clean
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  diag:
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install -e .

      - name: build a venv with an exclamation-mark prompt
        shell: python
        run: |
          from virtualenv import cli_run
          cli_run(["--prompt", "foo!SECRET!bar", "venv_bang"])

      - name: write a wrapper that enables delayed expansion before activating
        shell: python
        run: |
          import pathlib
          pathlib.Path("wrapper.bat").write_text(
              "@setlocal enabledelayedexpansion\r\n"
              "@set SECRET=leaked-value\r\n"
              r'@call venv_bang\Scripts\activate.bat' "\r\n"
              "@echo PROMPT_VALUE=%VIRTUAL_ENV_PROMPT%\r\n",
              encoding="ascii",
          )

      - name: run the wrapper
        shell: cmd
        run: call wrapper.bat
