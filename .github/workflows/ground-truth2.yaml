name: ground-truth-amp-in-path-v2
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  patched:
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install -e .
      - name: build venv with ampersand in dest, inspect activate.bat, then call it
        shell: python
        run: |
          from virtualenv import cli_run
          cli_run(["a&&b_venv"])
          import pathlib
          bat = pathlib.Path("a&&b_venv") / "Scripts" / "activate.bat"
          print("=== VIRTUAL_ENV line ===")
          for line in bat.read_text(encoding="utf-8").splitlines():
              if "VIRTUAL_ENV=" in line and "PROMPT" not in line and "PATH" not in line:
                  print(repr(line))
      - name: call activate.bat and print VIRTUAL_ENV
        shell: cmd
        run: |
          call "a&&b_venv\Scripts\activate.bat"
          echo VIRTUAL_ENV_IS=%VIRTUAL_ENV%
          dir "a&&b_venv" 1>nul 2>nul && echo REAL_DIR_EXISTS=yes || echo REAL_DIR_EXISTS=no
